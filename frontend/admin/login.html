<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Admin Login — TechQuiz</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="stylesheet" href="/static/css/style.css" />
  </head>
  <body data-page="admin-login">
    <header class="shell topbar">
      <a class="brand" href="/"><span class="brand-mark">T</span>TECHQUIZ</a>
      <nav class="nav"><a href="/">Back to site</a></nav>
    </header>
    <main class="page-main">
      <section class="narrow auth-card">
        <div class="page-title">
          <div class="kicker">Host access</div>
          <h1>Admin sign in</h1>
          <p>
            Manage your real-time competition from one secure control panel.
          </p>
        </div>
        <form id="login-form" class="form-stack">
          <div class="field">
            <label for="username">Username</label
            ><input
              id="username"
              name="username"
              autocomplete="username"
              maxlength="80"
              required
            />
          </div>
          <div class="field">
            <label for="password">Password</label
            ><input
              id="password"
              name="password"
              type="password"
              autocomplete="current-password"
              required
            />
          </div>
          <button class="button button-primary" id="login-button" type="submit">
            Sign in
          </button>
          <p class="notice" id="login-message" aria-live="polite"></p>
        </form>
      </section>
    </main>
    <footer class="site-footer">
      <span>© 2026 TechQuiz</span
      ><strong>Created by Vijay Kumar Dholpuria</strong>
    </footer>
    <script src="/static/js/api.js" defer></script>
    <script src="/static/js/auth.js" defer></script>
  </body>
</html>
